type: object
description:
  $ref: "./descriptions/ResponsePostOauthAccessToken.md"
required:
  - access_token
  - error
  - error_message
properties:
  access_token:
    type: string
    description: 成功時のアクセストークン値。
  error:
    $ref: ./EnumResponsePostOauthAccessTokenError.yaml
    description: エラーの有無。処理成功時は常に `0`。
  error_message:
    type: string
    description: エラー時のメッセージ (成功時は空文字)。
