type: object
description: |-
  ヤマレコ API のエラーレスポンス。

  サーバ処理失敗時は HTTP ステータス `200` で返り、`err: 1` と `errcode` でエラー要因を示す。
  OAuth 認証エラー時のみ HTTP ステータス `403` が返る。
required:
  - err
  - errcode
properties:
  err:
    type: integer
    enum:
      - 1
    description: エラーの有無 (常に `1`)。
  errcode:
    type: string
    description: エラー要因のコード (文字列)。
