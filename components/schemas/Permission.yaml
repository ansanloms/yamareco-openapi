type: object
description: 山行記録／計画のアクセス権限設定。
required:
  - guest
  - user
  - friend
  - following
properties:
  guest:
    $ref: ./EnumGuest.yaml
    description: |-
      ログインしていないユーザーへのアクセス権限。`0`: 不可、`1`: 可。
  user:
    $ref: ./EnumUser.yaml
    description: |-
      ログイン済みユーザーへのアクセス権限。`0`: 不可、`1`: 可。
  friend:
    $ref: ./EnumFriend.yaml
    description: |-
      友達リストに追加済みユーザーへのアクセス権限。`user=0` のときのみ有効。`0`: 不可、`1`: 可。
  following:
    $ref: ./EnumFollowing.yaml
    description: |-
      現在フォローしているユーザーへのアクセス権限。`user=0` のときのみ有効。`0`: 不可、`1`: 可。
