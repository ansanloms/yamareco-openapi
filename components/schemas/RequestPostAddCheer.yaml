type: object
required:
  - type
  - id
properties:
  type:
    $ref: ./EnumCheerType.yaml
    description: |-
      拍手対象。`rec`: 記録、`rec_photo`: 記録の写真。
  id:
    type: string
    description: |-
      拍手対象の ID。`type=rec` の場合は記録の ID、`type=rec_photo` の場合は写真の ID。
  anonymous:
    type: integer
    description: |-
      こっそり拍手。`1`: こっそり拍手 (匿名 `uid=0` で登録、キャンセル不可)、それ以外: ユーザ ID 指定で拍手。
