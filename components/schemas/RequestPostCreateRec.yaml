type: object
required:
  - place
  - start
  - end
  - area_id
  - genre_id
  - group_id
  - other_members
  - commentopen
properties:
  place:
    type: string
    description: 場所の名前。
  start:
    type: string
    format: date
    description: 入山日 (YYYY-MM-DD、1950-01-01 以降)。
  end:
    type: string
    format: date
    description: 下山日 (YYYY-MM-DD、1950-01-01 以降)。
  area_id:
    type: integer
    description: |-
      エリア ID。`0`: 未選択 (記録一覧の掲載対象外)、その他は `getArealist` の値。
  genre_id:
    type: integer
    description: |-
      ジャンル ID。`0`: 未選択 (記録一覧の掲載対象外)、その他は `getGenrelist` の値。
  group_id:
    type: integer
    enum:
      - 0
    description: |-
      グループ ID。現在は取得する API が無いため `0` 固定。
  time:
    type: string
    description: コースタイム。
  weather:
    type: string
    description: 天気。
  other_info:
    type: string
    description: コース状況。
  other_info2:
    type: string
    description: その他情報。
  other_members:
    type: integer
    minimum: 0
    description: その他のメンバー人数。
  commentopen:
    type: integer
    enum:
      - 0
      - 1
    description: |-
      コメントを受け付ける。`0`: 受け付けない、`1`: 受け付ける。デフォルト `1` を推奨。
  access_train:
    type: integer
    enum:
      - 0
      - 1
    description: アクセスに電車を利用 (未記入時は `0`)。
  access_bus:
    type: integer
    enum:
      - 0
      - 1
    description: アクセスにバスを利用 (未記入時は `0`)。
  access_taxi:
    type: integer
    enum:
      - 0
      - 1
    description: アクセスにタクシーを利用 (未記入時は `0`)。
  access_car:
    type: integer
    enum:
      - 0
      - 1
    description: アクセスに車を利用 (未記入時は `0`)。
  access_cable:
    type: integer
    enum:
      - 0
      - 1
    description: アクセスにケーブルカー／リフトを利用 (未記入時は `0`)。
  access_ship:
    type: integer
    enum:
      - 0
      - 1
    description: アクセスに船を利用 (未記入時は `0`)。
  access_air:
    type: integer
    enum:
      - 0
      - 1
    description: アクセスに飛行機を利用 (未記入時は `0`)。
  access_cycle:
    type: integer
    enum:
      - 0
      - 1
    description: アクセスに自転車を利用 (未記入時は `0`)。
  access_detail:
    type: string
    description: アクセスの詳細 (駐車場の情報など)。
  with_child:
    type: integer
    enum:
      - 0
      - 1
    description: |-
      (小学校くらいまでの) 子供連れの登山。`0`: 子供連れではない、`1`: 子供連れ。未記入時は `0`。
  draft:
    type: integer
    enum:
      - 0
      - 1
    description: |-
      下書き。`0`: 公開状態、`1`: 下書き状態。下書きの場合、参加メンバーのみ閲覧可能。
