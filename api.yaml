  /getArealist:
    get:
      operationId: getGetArealist
      summary: エリア定義一覧の取得。
      tags:
        - other
      description: |
        ヤマレコで定義されているエリア (山域) の定義一覧を取得する。
      security: []
      responses:
        '200':
          description: |-
            処理結果。HTTP 200 でレスポンスボディの `err` フィールドにより成否を判定する。
            - `err: 0`: 処理成功 (Success スキーマ)
            - `err: 1`: サーバ処理エラー (`ResponseError` スキーマ、`errcode` でエラー要因)。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseGetArealistOrError'
              examples:
                succeeded:
                  value:
                    err: 0
                    arealist:
                      - area_id: 100
                        area: 北海道
                      - area_id: 200
                        area: 東北
                      - area_id: 700
                        area: 富士・御坂
                failed:
                  value:
                    err: 1
                    errcode: NOT_FOUND
  /getCheerlist/{type}/{id}:
    get:
      operationId: getGetCheerlistTypeId
      summary: 拍手数の取得。
      tags:
        - rec
      description: |
        該当する対象 (記録または写真) についた拍手の一覧を取得する。
      parameters:
        - in: path
          name: type
          required: true
