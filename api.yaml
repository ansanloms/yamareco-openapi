            thumb800_url:
              type: string
              format: uri
              description: 登録された写真のアドレス (最大辺の長さ 800px)。
    ResponsePostAddTrack:
      allOf:
        - $ref: '#/components/schemas/ResponseBase'
        - type: object
          required:
