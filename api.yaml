        days:
          type: integer
          description: 日数。
        add_date:
          type: integer
          description: 予備日。予備として確保している日数で、`days` には含まれない。
        area_id:
          type: integer
          description: エリア ID。
        area:
          type: string
          description: エリア名。
        genre_id:
          type: integer
          description: ジャンル ID。
        genre:
          type: string
          description: ジャンル名。
