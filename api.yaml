  /oauth:
    get:
      operationId: getOauth
      summary: OAuth 認可コードの取得。
      tags:
        - oauth
      description: |
        OAuth 認証フローの最初のステップ。ブラウザでユーザがログインし許可した場合、リダイレクト先 URL に認可コードが `?code=<CODE>` の形式で通知される。

        キャッシュ防止のためタイムスタンプパラメータの付与を推奨。
      security: []
      parameters:
        - in: query
          name: client_id
          required: true
          description: アプリケーション登録時に取得したクライアント ID。
          schema:
            type: string
        - in: query
          name: redirect_uri
          required: true
          description: 登録済みのリダイレクト先 URL。
          schema:
            type: string
            format: uri
        - in: query
          name: response_type
          required: true
          description: 固定値 `code`。
          schema:
            type: string
            enum:
              - code
        - in: query
          name: scope
          required: true
          description: 固定値 `all`。
          schema:
            type: string
            enum:
              - all
      responses:
        '302':
          description: ユーザがログイン・許可した場合、`redirect_uri` のクエリパラメータ `code` に認可コードを付与してリダイレクトされる。
          headers:
            Location:
              description: 認可コード付きのリダイレクト先 URL。
              schema:
                type: string
                format: uri
  /oauth/access_token:
    post:
      operationId: postOauthAccessToken
      summary: OAuth アクセストークンの取得。
      tags:
        - oauth
      description: |
        OAuth 認証フローで取得した認可コードを利用してアクセストークンを取得する。

        取得したアクセストークンは `Authorization: OAuth <access_token>` の形式で各 API へのリクエストヘッダに付与する。
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RequestPostOauthAccessToken'
            examples:
              normal:
                value:
                  client_id: my_client_id
                  client_secret: my_client_secret
                  redirect_uri: https://example.org/callback
                  code: AUTHORIZATION_CODE_HERE
                  grant_type: authorization_code
      responses:
        '200':
          description: |-
            処理結果。HTTP 200 でレスポンスボディの `error` フィールドにより成否を判定する。
            - `error: 0`: 処理成功 (`ResponsePostOauthAccessToken`、`access_token` に値)
            - `error: 1`: 処理失敗 (`ResponseOAuthError`、`error_message` に要因)。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ResponsePostOauthAccessToken'
                  - $ref: '#/components/schemas/ResponseOAuthError'
              examples:
                succeeded:
                  value:
                    access_token: 5d393ec8c36122523baf7a966c21a647faeba8aa
                    error: 0
                    error_message: ''
                failed:
                  value:
                    access_token: ''
                    error: 1
                    error_message: Invalid authorization code
  /oauth/sign_out:
    get:
      operationId: getOauthSignOut
      summary: OAuth サインアウト。
      tags:
        - oauth
      description: |
        サインアウト処理を行う。`redirect_uri` は省略可能で、省略時はログアウト完了メッセージページが表示される。
      security: []
      parameters:
        - in: query
          name: redirect_uri
          required: false
          description: 省略可能。省略時はログアウト完了メッセージページが表示される。
          schema:
            type: string
            format: uri
      responses:
        '200':
          description: '`redirect_uri` 省略時はログアウト完了メッセージページが表示される。'
          content:
            text/html:
              schema:
                type: string
        '302':
          description: サインアウト処理完了後、`redirect_uri` 指定時は当該 URL へリダイレクトされる。
          headers:
            Location:
              description: リダイレクト先 URL。
              schema:
                type: string
                format: uri
