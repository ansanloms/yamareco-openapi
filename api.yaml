              description: コメント ID。
    ResponsePostAddNote:
      allOf:
        - $ref: '#/components/schemas/ResponseBase'
        - type: object
          required:
            - rec_id
          properties:
            rec_id:
              type: integer
              description: 記録の ID。
    ResponsePostAddPhoto:
      allOf:
