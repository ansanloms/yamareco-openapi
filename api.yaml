openapi: 3.2.1
info:
  version: 0.0.1
  title: ヤマレコ Web API
  description: |
    # yamareco-openapi

    ヤマレコ Web API ([https://sites.google.com/site/apiforyamareco/home](https://sites.google.com/site/apiforyamareco/home)) の非公式 OpenAPI 仕様。

    ## 開発

    - `.node-version` に書かれたバージョンの Node が必要。
    - `npm ci`: 依存を入れる。
    - `npm run lint`: 型検査、oxlint と oxfmt、textlint、redocly lint を順に実行する。
    - `npm test`: `bin/` 配下のスクリプトのテストを実行する。
    - `npm run fix`: sort と textlint、oxlint、oxfmt の各 fixer を順に実行して最後に lint する (途中で失敗しても続行)。
    - `npm run build`: `dist/` に `index.html` (Redoc の JS を埋め込んだ単一の HTML) と `api.yaml` を出力する。
    - `npm run dev`: Vite の dev サーバを `http://localhost:4000` で起動する。dev サーバは spec を `redocly build-docs` で HTML にして返す。spec のファイルを編集すると HTML が作り直され、ブラウザが再読み込みされる。

    依存は `.npmrc` により正確な版で固定する。自前の 2 パッケージ (textlint-plugin-yaml-keys、redocly-plugins) は GitHub のタグを git 依存で参照しており、Dependabot が更新しないため `package.json` のタグを手で書き換えて `npm install` する。
servers:
  - url: https://api.yamareco.com/api/v1
    description: 本番サーバ。
security:
  - oauthToken: []
tags:
  - name: oauth
    description: OAuth 認証関連。
  - name: rec
    description: 山行記録。
  - name: plan
    description: 山行計画。
  - name: other
    description: 共通／その他。
paths:
  /addCheer:
    post:
      operationId: postAddCheer
      summary: 拍手の登録。
      tags:
        - rec
      description: |
        登録済みの記録または写真に拍手をする。1 人につき 1 回のみ拍手が登録でき、すでに拍手済みの場合はエラーが返される。
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RequestPostAddCheer'
      responses:
        '200':
          description: |-
            処理結果。HTTP 200 でレスポンスボディの `err` フィールドにより成否を判定する。
            - `err: 0`: 処理成功 (Success スキーマ)
            - `err: 1`: サーバ処理エラー (`ResponseError` スキーマ、`errcode` でエラー要因)。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ResponseBase'
                  - $ref: '#/components/schemas/ResponseError'
              examples:
                succeeded:
                  value:
                    err: 0
                failed:
                  value:
                    err: 1
                    errcode: NOT_FOUND
        '403':
          description: OAuth 認証エラー。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              examples:
                authError:
                  value:
                    err: 1
                    errcode: NOT_FOUND
