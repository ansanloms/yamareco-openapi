components:
  schemas:
    Area:
      type: object
      description: ヤマレコで定義されているエリア (山域) 区分。
      required:
        - area_id
        - area
      properties:
        area_id:
          type: integer
          description: エリア ID。
        area:
          type: string
          description: エリア名。
    CheerUser:
      type: object
      description: 拍手をしたユーザの情報。
      required:
        - uid
        - uname
      properties:
        uid:
          type: integer
          description: ユーザ ID。
        uname:
          type: string
          description: ユーザ名。
        avatar:
          type: string
          description: プロフィール画像の URL (未設定の場合は空欄)。
    Comment:
      type: object
      description: 山行記録／計画に登録されたコメント。
      required:
        - com_id
        - uid
        - text
      properties:
        com_id:
          type: integer
          description: コメント ID。
        uid:
          type: integer
          description: コメントしたユーザのユーザ ID。
        title:
          type: string
          description: コメントのタイトル。
        text:
          type: string
          description: コメント本文。
        created:
          type: integer
          format: int64
          description: コメントの作成日時 (Unix time、1970-01-01 00:00:00 UTC からの経過秒)。
        uname:
          type: string
          description: コメントしたユーザのユーザ名。
        avatar:
          type: string
          description: プロフィール画像の URL。
    Equip:
      type: object
      description: 山行計画の装備一覧 (共同装備／個人装備)。
      properties:
        share:
          type: array
          description: 共同装備の一覧。
          items:
            $ref: '#/components/schemas/EquipItem'
        personal:
          type: array
          description: 個人装備の一覧。
          items:
            $ref: '#/components/schemas/EquipItem'
    EquipItem:
      type: object
      description: 装備アイテム。
      required:
        - name
      properties:
        name:
          type: string
          description: 装備名。
    Genre:
      type: object
      description: ヤマレコで定義されている山行ジャンル区分。
      required:
        - genre_id
        - genre
      properties:
        genre_id:
          type: integer
          description: ジャンル ID。
        genre:
          type: string
          description: ジャンル名。
    Member:
      type: object
      description: 山行記録／計画の参加メンバー (簡易情報)。
      required:
        - uname
        - uid
      properties:
        uname:
          type: string
          description: ユーザ名。
        uid:
          type: integer
          description: ユーザ ID。
    MemberDetail:
      type: object
      description: 山行記録／計画の参加メンバー (役割情報を含む)。
      required:
        - uname
        - uid
      properties:
        uname:
          type: string
          description: ユーザ名。
        uid:
          type: integer
          description: ユーザ ID。
        avatar:
          type: string
          description: プロフィール画像の URL。
        role_id:
          type: integer
          description: 役割の ID。
        role:
          type: string
          description: 役割名。
    Note:
      type: object
      description: 山行記録に登録された感想。
      required:
        - uid
        - uname
        - text
      properties:
        uid:
          type: integer
          description: ユーザ ID。
        uname:
          type: string
          description: ユーザ名。
        text:
          type: string
          description: 感想本文。
        private:
          type: integer
          enum:
            - 0
            - 1
          description: '感想の公開範囲。`0`: 公開、`1`: 参加メンバーのみに公開 (非公開)。'
    Permission:
      type: object
      description: 山行記録／計画のアクセス権限設定。
      required:
        - guest
        - user
        - friend
        - following
      properties:
        guest:
          type: integer
          enum:
            - 0
            - 1
          description: 'ログインしていないユーザーへのアクセス権限。`0`: 不可、`1`: 可。'
        user:
          type: integer
          enum:
            - 0
            - 1
          description: 'ログイン済みユーザーへのアクセス権限。`0`: 不可、`1`: 可。'
        friend:
          type: integer
          enum:
            - 0
            - 1
          description: '友達リストに追加済みユーザーへのアクセス権限。`user=0` のときのみ有効。`0`: 不可、`1`: 可。'
        following:
          type: integer
          enum:
            - 0
            - 1
          description: '現在フォローしているユーザーへのアクセス権限。`user=0` のときのみ有効。`0`: 不可、`1`: 可。'
    Photo:
      type: object
      description: 山行記録／計画に登録された写真。
      required:
        - pid
        - order
        - photo_url
        - thumb_url
      properties:
        pid:
          type: string
          description: 写真 ID。
        comment:
          type: string
          description: 写真のコメント。
        private:
          type: integer
          enum:
            - 0
            - 1
          description: '写真の公開範囲。`0`: 公開、`1`: 参加メンバーのみに公開 (非公開)。'
        picked:
          type: integer
          enum:
            - 0
            - 1
          description: '代表写真。`0`: 代表写真ではない、`1`: 代表写真。'
        order:
          type: integer
          description: 写真の並び順 (小さいものから順に並ぶ)。
        photo_url:
          type: string
          format: uri
          description: 写真のアドレス (オリジナルサイズ)。
        thumb_url:
          type: string
          format: uri
          description: 写真のアドレス (小サイズ、最大辺の長さ 160px)。
        thumb80_url:
          type: string
          format: uri
          description: 写真のアドレス (最大辺の長さ 80px)。
        thumb450_url:
          type: string
          format: uri
          description: 写真のアドレス (最大辺の長さ 450px)。
        thumb800_url:
          type: string
          format: uri
          description: 写真のアドレス (最大辺の長さ 800px)。
    PlanDetail:
      type: object
      description: 山行計画の詳細情報。
      required:
        - plan_id
        - uid
        - place
        - start
        - end
        - days
        - area_id
        - area
        - genre_id
        - genre
        - group_id
        - other_members
      properties:
        plan_id:
          type: integer
          description: 計画の ID。
        uid:
          type: integer
          description: 計画所有者のユーザ ID。
        place:
          type: string
          description: 場所の名前。
        start:
          type: string
          format: date
          description: 入山日 (YYYY-MM-DD)。
        end:
          type: string
          format: date
          description: 下山日 (YYYY-MM-DD)。
        days:
          type: integer
          description: 日数。
        add_date:
          type: integer
          description: 予備日。予備として確保している日数で、`days` には含まれない。
        area_id:
          type: integer
          description: エリア ID。
        area:
          type: string
          description: エリア名。
        genre_id:
          type: integer
          description: ジャンル ID。
        genre:
          type: string
          description: ジャンル名。
        group_id:
          type: integer
          description: 'グループ ID。`0`: 個人の計画、`1` 以上: 当該グループの計画。'
        other_members:
          type: integer
          description: その他のメンバー人数。
        other_member_names:
          type: string
          description: その他メンバーの名前 (計画の参加メンバーがリクエストを送ったときのみ応答がある)。
