              $ref: '#/components/schemas/RequestPostCreateRec'
            examples:
              normal:
                value:
                  place: 富士山
                  start: '2026-04-01'
                  end: '2026-04-02'
                  area_id: 700
                  genre_id: 1
                  group_id: 0
                  time: 8:00 出発 / 16:00 下山
                  weather: 晴れ
                  other_info: コース整備良好
                  other_info2: 売店営業中
                  other_members: 0
                  commentopen: 1
                  access_train: 1
                  access_bus: 1
                  access_taxi: 0
                  access_car: 0
                  access_cable: 0
                  access_ship: 0
                  access_air: 0
                  access_cycle: 0
                  access_detail: 富士急行線で河口湖駅まで。
                  with_child: 0
                  draft: 0
      responses:
        '200':
          description: |-
            処理結果。HTTP 200 でレスポンスボディの `err` フィールドにより成否を判定する。
            - `err: 0`: 処理成功 (Success スキーマ)
            - `err: 1`: サーバ処理エラー (`ResponseError` スキーマ、`errcode` でエラー要因)。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ResponsePostCreateRec'
                  - $ref: '#/components/schemas/ResponseError'
              examples:
                succeeded:
                  value:
                    err: 0
                    rec_id: 8000001
                failed:
                  value:
                    err: 1
                    errcode: NOT_FOUND
        '403':
          description: OAuth 認証エラー。
          content:
