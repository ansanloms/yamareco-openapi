openapi: 3.2.1
info:
  version: 0.0.1
  title: ヤマレコ Web API
  description: |
    # yamareco-openapi

    ヤマレコ Web API ([https://sites.google.com/site/apiforyamareco/home](https://sites.google.com/site/apiforyamareco/home)) の非公式 OpenAPI 仕様。
servers:
  - url: https://api.yamareco.com/api/v1
    description: 本番サーバ。
security:
  - oauthToken: []
tags:
  - name: oauth
    description: OAuth 認証関連。
  - name: rec
    description: 山行記録。
  - name: plan
    description: 山行計画。
  - name: other
    description: 共通／その他。
paths:
  /addCheer:
    post:
      operationId: postAddCheer
      summary: 拍手の登録。
      tags:
        - rec
      description: |
        登録済みの記録または写真に拍手をする。1 人につき 1 回のみ拍手が登録でき、すでに拍手済みの場合はエラーが返される。
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RequestPostAddCheer'
      responses:
        '200':
          description: |-
            処理結果。HTTP 200 でレスポンスボディの `err` フィールドにより成否を判定する。
            - `err: 0`: 処理成功 (Success スキーマ)
            - `err: 1`: サーバ処理エラー (`ResponseError` スキーマ、`errcode` でエラー要因)。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponsePostAddCheerOrError'
              examples:
                succeeded:
                  value:
                    err: 0
                failed:
                  value:
                    err: 1
                    errcode: NOT_FOUND
        '403':
          description: OAuth 認証エラー。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              examples:
                authError:
                  value:
                    err: 1
                    errcode: NOT_FOUND
  /addComment:
    post:
      operationId: postAddComment
      summary: コメントの登録。
      tags:
        - rec
      description: |
        登録済みの山行記録にコメントを残す。
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RequestPostAddComment'
      responses:
        '200':
          description: |-
            処理結果。HTTP 200 でレスポンスボディの `err` フィールドにより成否を判定する。
            - `err: 0`: 処理成功 (Success スキーマ)
            - `err: 1`: サーバ処理エラー (`ResponseError` スキーマ、`errcode` でエラー要因)。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponsePostAddCommentOrError'
        '403':
          description: OAuth 認証エラー。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
  /addNote:
    post:
      operationId: postAddNote
      summary: 感想の登録。
      tags:
        - rec
      description: |
        登録済みの山行記録に感想を登録する。1 人につき 1 つのみ感想が登録できる。すでに登録済みの場合はエラーが返される。
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RequestPostAddNote'
      responses:
        '200':
          description: |-
            処理結果。HTTP 200 でレスポンスボディの `err` フィールドにより成否を判定する。
            - `err: 0`: 処理成功 (Success スキーマ)
            - `err: 1`: サーバ処理エラー (`ResponseError` スキーマ、`errcode` でエラー要因)。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponsePostAddNoteOrError'
        '403':
          description: OAuth 認証エラー。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
  /addPhoto/{rec_id}/{type}/{maxsize}/{rotate}:
    post:
      operationId: postAddPhotoRecIdTypeMaxsizeRotate
      summary: 写真の追加登録。
      tags:
        - rec
      description: |
        登録済みの山行記録に写真を追加登録する。

        メッセージボディには写真データ (バイナリ) を格納し、パラメータは URL に含めて送信する。
      parameters:
        - in: path
          name: rec_id
          required: true
          description: 記録の ID。
          schema:
            type: integer
        - in: path
          name: type
          required: true
          description: 写真のファイルタイプ。
          schema:
            $ref: '#/components/schemas/EnumPhotoType'
        - in: path
          name: maxsize
          required: true
          description: |-
            写真の長辺の長さ (px)。縦もしくは横のうち長い辺のサイズが指定したピクセル数で縮小される。
            `0` 入力時はオリジナルの写真を維持する。

            ヤマレコ Web では選択肢は `1600`/`1280`/`1024`/`640`/オリジナルだが、本 API では任意の数字を入力できる。
          schema:
            type: integer
            minimum: 0
        - in: path
          name: rotate
          required: true
          description: 写真の回転指定。自動判別は JPEG の Exif データを利用する。
          schema:
            $ref: '#/components/schemas/EnumRotate'
      requestBody:
        required: true
        description: 写真データ (バイナリ)。
        content:
          image/jpeg:
            schema:
              $ref: '#/components/schemas/RequestPostAddPhotoRecIdTypeMaxsizeRotate'
          image/png:
            schema:
              $ref: '#/components/schemas/RequestPostAddPhotoRecIdTypeMaxsizeRotate'
          image/gif:
            schema:
              $ref: '#/components/schemas/RequestPostAddPhotoRecIdTypeMaxsizeRotate'
      responses:
        '200':
          description: |-
            処理結果。HTTP 200 でレスポンスボディの `err` フィールドにより成否を判定する。
            - `err: 0`: 処理成功 (Success スキーマ)
            - `err: 1`: サーバ処理エラー (`ResponseError` スキーマ、`errcode` でエラー要因)。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponsePostAddPhotoOrError'
        '403':
          description: OAuth 認証エラー。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
  /addTrack/{rec_id}/{logtype}/{thinout}/{sensor}/{merge}:
    post:
      operationId: postAddTrackRecIdLogtypeThinoutSensorMerge
      summary: GPS ログの登録。
      tags:
        - rec
      description: |
        登録済みの山行記録に GPS ログを登録する。

        メッセージボディには GPS ログデータ (バイナリ) を格納し、パラメータは URL に含めて送信する。

        GPS ログファイルの上限は 5 MB 程度 (5,000,000 byte)。それ以上のサイズはエラーとなる。応答までの時間も長くなるため、ファイルサイズが大きくなる場合は間引きなどをしてから登録することが推奨される。
      parameters:
        - in: path
          name: rec_id
          required: true
          description: 記録の ID。
          schema:
            type: integer
        - in: path
          name: logtype
          required: true
          description: 'GPS ログの種別。`gpx`: GPX、`kml`: KML、`nmea`: NMEA、`gdb`: Garmin Mapsource (.gdb)、`gtrnctr`: Garmin Training Center (.tcx)。'
          schema:
            $ref: '#/components/schemas/EnumLogType'
        - in: path
          name: thinout
          required: true
          description: |-
            ルートの間引き量。`0`: 間引きなし、`1` 以上: 指定した数に間引き。

            ヤマレコ Web では選択肢は間引きなし/`500`/`1000`/`3000` だが、本 API では任意の数字を入力できる。
          schema:
            type: integer
            minimum: 0
        - in: path
          name: sensor
          required: true
          description: |-
            GPS で採取したログかどうか。`0`: GPS 採取ログではない、`1`: GPS 採取ログ。
            手入力などで作成したログの場合は `0` 推奨。`1` を指定した場合はコースタイムが自動計算される (上書き)。
          schema:
            $ref: '#/components/schemas/EnumSensor'
        - in: path
          name: merge
          required: true
          description: 'GPS ログの追記モード。`0`: 既存ルートがある場合は上書き保存、`1`: 既存ルートがある場合は追記。'
          schema:
            $ref: '#/components/schemas/EnumMerge'
      requestBody:
        required: true
        description: GPS ログデータ (バイナリ)。
        content:
          application/octet-stream:
            schema:
              $ref: '#/components/schemas/RequestPostAddTrackRecIdLogtypeThinoutSensorMerge'
      responses:
        '200':
          description: |-
            処理結果。HTTP 200 でレスポンスボディの `err` フィールドにより成否を判定する。
            - `err: 0`: 処理成功 (Success スキーマ)
            - `err: 1`: サーバ処理エラー (`ResponseError` スキーマ、`errcode` でエラー要因)。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponsePostAddTrackOrError'
        '403':
          description: OAuth 認証エラー。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
  /createRec:
    post:
      operationId: postCreateRec
      summary: 山行記録の新規登録。
      tags:
        - rec
      description: |
        新しく山行記録を登録する。メンバーには自動的に登録者が追加され、個人の記録として登録される。
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RequestPostCreateRec'
            examples:
              normal:
                value:
                  place: 富士山
                  start: '2026-04-01'
                  end: '2026-04-02'
                  area_id: 700
                  genre_id: 1
                  group_id: 0
                  time: 8:00 出発 / 16:00 下山
                  weather: 晴れ
                  other_info: コース整備良好
                  other_info2: 売店営業中
                  other_members: 0
                  commentopen: 1
                  access_train: 1
                  access_bus: 1
                  access_taxi: 0
                  access_car: 0
                  access_cable: 0
                  access_ship: 0
                  access_air: 0
                  access_cycle: 0
                  access_detail: 富士急行線で河口湖駅まで。
                  with_child: 0
                  draft: 0
      responses:
        '200':
          description: |-
            処理結果。HTTP 200 でレスポンスボディの `err` フィールドにより成否を判定する。
            - `err: 0`: 処理成功 (Success スキーマ)
            - `err: 1`: サーバ処理エラー (`ResponseError` スキーマ、`errcode` でエラー要因)。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponsePostCreateRecOrError'
              examples:
                succeeded:
                  value:
                    err: 0
                    rec_id: 8000001
                failed:
                  value:
                    err: 1
                    errcode: NOT_FOUND
        '403':
          description: OAuth 認証エラー。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              examples:
                authError:
                  value:
                    err: 1
                    errcode: NOT_FOUND
  /deleteCheer:
