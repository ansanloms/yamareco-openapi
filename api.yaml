              description: GPX ログファイルのアドレス (間引き等の処理後のファイル)。
    ResponsePostCreateRec:
      allOf:
        - $ref: '#/components/schemas/ResponseBase'
        - type: object
          required:
            - rec_id
          properties:
            rec_id:
              type: integer
              description: 記録の ID。全く同じ内容のデータを登録しようとした場合は、データを作成せず、見つかった山行記録の ID を応答する。
    ResponsePostDeleteCheer:
      $ref: '#/components/schemas/ResponseBase'
    ResponsePostDeleteComment:
      $ref: '#/components/schemas/ResponseBase'
    ResponsePostDeleteNote:
      allOf:
        - $ref: '#/components/schemas/ResponseBase'
        - type: object
          required:
            - rec_id
          properties:
            rec_id:
              type: integer
              description: 記録の ID。
    ResponsePostDeletePhote:
      allOf:
        - $ref: '#/components/schemas/ResponseBase'
        - type: object
          required:
            - rec_id
            - pid
          properties:
            rec_id:
              type: integer
              description: 記録の ID。
            pid:
              type: string
              description: 写真の ID。
    ResponsePostDeleteRec:
      allOf:
        - $ref: '#/components/schemas/ResponseBase'
        - type: object
          required:
            - rec_id
          properties:
            rec_id:
              type: integer
              description: 削除した記録の ID。
    ResponsePostDeleteTrack:
      allOf:
        - $ref: '#/components/schemas/ResponseBase'
        - type: object
          required:
            - rec_id
          properties:
            rec_id:
              type: integer
              description: 記録の ID。
    ResponsePostEditNote:
      allOf:
        - $ref: '#/components/schemas/ResponseBase'
        - type: object
          required:
            - rec_id
          properties:
            rec_id:
              type: integer
              description: 記録の ID。
    ResponsePostEditPhote:
      allOf:
        - $ref: '#/components/schemas/ResponseBase'
        - type: object
          required:
            - rec_id
            - pid
          properties:
            rec_id:
              type: integer
              description: 記録の ID。
            pid:
              type: string
              description: 写真の ID。
    ResponsePostEditRec:
      allOf:
        - $ref: '#/components/schemas/ResponseBase'
        - type: object
          required:
            - rec_id
          properties:
            rec_id:
              type: integer
              description: 記録の ID。
    ResponsePostNearbyPoi:
      $ref: '#/components/schemas/ResponsePostSearchPoi'
    ResponsePostOauthAccessToken:
      type: object
      description: |-
        OAuth アクセストークン取得の成功時レスポンス。

        HTTP ステータスコードは処理の成否によらず `200` が返り、`error` フィールドで成否を判定する。
        処理失敗時は本スキーマではなく `ResponseOAuthError` (`error: 1`) が返る。
      required:
        - access_token
        - error
        - error_message
      properties:
        access_token:
          type: string
          description: 成功時のアクセストークン値。
        error:
          type: integer
          enum:
            - 0
          description: エラーの有無。処理成功時は常に `0`。
        error_message:
          type: string
          description: エラー時のメッセージ (成功時は空文字)。
    ResponsePostRelatePlanAndRec:
      $ref: '#/components/schemas/ResponseBase'
    ResponsePostSearchPlan:
      $ref: '#/components/schemas/ResponseGetPlanlist'
    ResponsePostSearchPoi:
      allOf:
        - $ref: '#/components/schemas/ResponseBase'
        - type: object
          required:
            - poilist
          properties:
            poilist:
              type: array
              description: 地名データの一覧。
              items:
                $ref: '#/components/schemas/Poi'
    ResponsePostSearchRec:
      $ref: '#/components/schemas/ResponseGetReclist'
  securitySchemes:
    oauthToken:
      type: apiKey
      in: header
      name: Authorization
      description: |
        OAuth 認証フローで取得した access token を `OAuth <access_token>` 形式で `Authorization` ヘッダに付与する。

        例: `Authorization: OAuth 5d393ec8c36122523baf7a966c21a647faeba8aa`

        OAuth 2.0 の Bearer 形式ではなく、独自の `OAuth` プレフィックス付き形式である点に注意。
