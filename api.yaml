          description: 拍手対象の ID。`type=rec` の場合は記録の ID、`type=rec_photo` の場合は写真の ID。
    RequestPostDeleteComment:
      type: object
      required:
        - com_id
      properties:
        com_id:
          type: string
          description: コメント ID。
    RequestPostDeleteNote:
      type: object
      required:
        - rec_id
      properties:
        rec_id:
          type: integer
          description: 記録の ID。
    RequestPostDeletePhote:
      type: object
      required:
        - rec_id
        - pid
      properties:
        rec_id:
          type: integer
          description: 記録の ID。
        pid:
          type: string
          description: 写真の ID。
    RequestPostDeleteRec:
      type: object
      required:
        - rec_id
      properties:
        rec_id:
          type: integer
          description: 記録の ID。
    RequestPostDeleteTrack:
      type: object
      required:
        - rec_id
      properties:
        rec_id:
          type: integer
          description: 記録の ID。
    RequestPostEditNote:
      type: object
      required:
        - rec_id
        - text
      properties:
        rec_id:
          type: integer
          description: 記録の ID。
        text:
          type: string
          description: 感想本文。
        private:
          type: integer
          enum:
            - 0
            - 1
          description: '感想の公開範囲。`0`: 公開、`1`: 参加メンバーのみに公開 (非公開)。省略時は `0`。'
    RequestPostEditPhote:
      type: object
      required:
        - rec_id
        - pid
        - order
      properties:
        rec_id:
          type: integer
          description: 記録の ID。
        pid:
          type: string
          description: 写真の ID。
        order:
          type: integer
          minimum: 1
          description: 写真の並び順 (小さい値から順に表示される)。
        comment:
          type: string
          description: 写真のコメント。
        private:
          type: integer
          enum:
            - 0
            - 1
          description: '写真の公開範囲。`0`: 公開、`1`: 参加メンバーのみに公開 (非公開)。'
        picked:
          type: integer
          enum:
            - 0
            - 1
          description: '代表写真。`0`: 代表写真ではない、`1`: 代表写真。'
    RequestPostEditRec:
      allOf:
        - type: object
          required:
            - rec_id
          properties:
            rec_id:
              type: integer
              description: 記録の ID。
        - $ref: '#/components/schemas/RequestPostCreateRec'
      description: 山行記録の編集リクエスト。`rec_id` 以外のフィールドは `RequestPostCreateRec` と同じ。
    RequestPostNearbyPoi:
      type: object
      required:
        - page
        - range
        - type_id
      properties:
        page:
          type: integer
          minimum: 1
          description: 一覧のページ番号。1 ページあたり 20 件。
        range:
          type: integer
          minimum: 1
          maximum: 30
          description: 検索したい範囲 (km、1〜30)。
        lat:
          type: number
          format: float
          description: 緯度。
        lon:
          type: number
          format: float
          description: 経度。
        type_id:
          type: integer
          description: '検索したい地名のデータ種別。`0`: 検索条件に入れない、`1` 以上: 該当するデータ種別。'
    RequestPostOauthAccessToken:
      type: object
      required:
        - client_id
        - client_secret
        - redirect_uri
        - code
        - grant_type
      properties:
        client_id:
          type: string
          description: アプリケーション登録時に取得したクライアント ID。
        client_secret:
          type: string
          description: アプリケーション登録時に取得したクライアントシークレット。
        redirect_uri:
          type: string
          format: uri
          description: 登録済みのリダイレクト先 URL。
        code:
          type: string
          description: 認可コード取得ステップで受け取った値。
        grant_type:
          type: string
          enum:
            - authorization_code
          description: 固定文字列 `authorization_code`。
    RequestPostRelatePlanAndRec:
      type: object
      required:
        - rec_id
        - plan_id
      properties:
        rec_id:
          type: integer
          description: 記録の ID。
        plan_id:
          type: integer
          description: 計画の ID。
    RequestPostSearchPlan:
      type: object
      required:
        - page
        - place
        - area_id
        - genre_id
        - is_track
        - ptid
      properties:
        page:
          type: integer
          minimum: 1
          description: 一覧のページ番号。1 ページあたり 20 件。
        place:
          type: string
          description: 検索したい計画の名称 (部分一致)。検索対象にしたくない場合は空欄。
        area_id:
          type: integer
          description: '検索したい計画のエリア ID。`0`: 検索条件に入れない、`1` 以上: 該当エリア。'
        genre_id:
          type: integer
          description: '検索したい計画のジャンル ID。`0`: 検索条件に入れない、`1` 以上: 該当ジャンル。'
        is_track:
          type: integer
          enum:
            - 0
            - 1
          description: 'ルートの有無。`0`: 検索条件に入れない、`1`: ルートがある計画。'
        ptid:
          type: integer
          description: '地名 ID。`0`: 検索条件に入れない、`1` 以上: 該当する地名の場所を通る計画。'
        group_id:
          type: integer
          description: 'グループ ID。`0`: 検索条件に入れない、`1` 以上: 該当グループに所属する山行計画。省略時は `0`。'
    RequestPostSearchPoi:
      type: object
      required:
        - page
        - type_id
      properties:
        page:
          type: integer
          minimum: 1
          description: 一覧のページ番号。1 ページあたり 20 件。
        name:
          type: string
          description: '検索したい地名の名称。空: 検索条件に入れない、2 文字以上: 部分一致で文字列検索。'
        type_id:
          type: integer
          description: '検索したい地名のデータ種別。`0`: 検索条件に入れない、`1` 以上: 該当するデータ種別。'
        area_id:
          type: integer
          description: |-
            検索したい地名のエリア ID。`0`: 検索条件に入れない、`1` 以上: 該当エリア。
            エリア ID が 100 の倍数 (関東などの大枠のエリア) の場合は、その配下の全エリアが検索対象になる。
        ptid:
          type: integer
          description: '表示したい地名の ID。`0`: 検索条件に入れない、`1` 以上: 該当する地名。'
    RequestPostSearchRec:
      type: object
      required:
        - page
        - place
        - area_id
        - genre_id
        - is_photo
        - is_track
        - ptid
      properties:
        page:
          type: integer
          minimum: 1
          description: 一覧のページ番号。1 ページあたり 20 件。
        place:
          type: string
          description: 検索したい記録の名称 (部分一致)。検索対象にしたくない場合は空欄。
        area_id:
          type: integer
          description: '検索したい記録のエリア ID。`0`: 検索条件に入れない、`1` 以上: 該当エリア。'
        genre_id:
          type: integer
          description: '検索したい記録のジャンル ID。`0`: 検索条件に入れない、`1` 以上: 該当ジャンル。'
        is_photo:
          type: integer
          enum:
            - 0
            - 1
          description: '写真の有無。`0`: 検索条件に入れない、`1`: 写真がある記録。'
        is_track:
          type: integer
          enum:
            - 0
            - 1
          description: 'ルートの有無。`0`: 検索条件に入れない、`1`: ルートがある記録。'
        with_child:
          type: integer
          enum:
            - 0
            - 1
          description: '子連れ登山。`0`: 検索条件に入れない、`1`: 子連れの記録。省略時は `0`。'
        guestok:
          type: integer
          enum:
            - 0
            - 1
          description: |-
            ゲスト閲覧可の記録。`0`: 検索条件に入れない、`1`: ゲスト閲覧可の記録のみ。
            `0` の場合は「ヤマレコ内部のみに公開」の記録も取得対象になり、`1` の場合は除外される。省略時は `0`。
        min_days:
          type: integer
          description: '最小日数。`0`: 検索条件に入れない、`1` 以上: 指定した日数以上の記録。省略時は `0`。'
        max_days:
          type: integer
          description: '最大日数。`0`: 検索条件に入れない、`1` 以上: 指定した日数以内の記録。省略時は `0`。'
        ptid:
          type: integer
          description: '地名 ID。`0`: 検索条件に入れない、`1` 以上: 該当する地名の場所を通る記録。'
        group_id:
          type: integer
          description: 'グループ ID。`0`: 検索条件に入れない、`1` 以上: 該当グループに所属する山行記録。省略時は `0`。'
        rec_id:
          type: integer
          description: '記録の ID。`0`: 検索条件に入れない、`1` 以上: 該当 ID の山行記録。省略時は `0`。'
    ResponseBase:
      type: object
      description: |-
        ヤマレコ API の処理成功時レスポンス共通基底。

        HTTP ステータスコードは処理の成否によらず `200` が返り、`err` フィールドで成否を判定する。
        処理失敗時は本スキーマではなく `ResponseError` (`err: 1`) が返る。
      required:
        - err
      properties:
        err:
          type: integer
          enum:
            - 0
          description: エラーの有無。処理成功時は常に `0`。
    ResponseError:
      type: object
      description: |-
        ヤマレコ API のエラーレスポンス。

        サーバ処理失敗時は HTTP ステータス `200` で返り、`err: 1` と `errcode` でエラー要因を示す。
        OAuth 認証エラー時のみ HTTP ステータス `403` が返る。
      required:
        - err
        - errcode
      properties:
        err:
          type: integer
          enum:
            - 1
          description: エラーの有無 (常に `1`)。
        errcode:
          type: string
          description: エラー要因のコード (文字列)。
    ResponseGetArealist:
      allOf:
        - $ref: '#/components/schemas/ResponseBase'
        - type: object
          required:
            - arealist
          properties:
            arealist:
              type: array
              description: エリアの定義一覧。
              items:
                $ref: '#/components/schemas/Area'
    ResponseGetCheerlist:
      allOf:
        - $ref: '#/components/schemas/ResponseBase'
        - type: object
          required:
            - total
            - userinfo
          properties:
            total:
              type: integer
              description: 拍手数 (こっそり拍手も含む合計)。
            userinfo:
              type: array
              description: 拍手者の一覧。
              items:
                $ref: '#/components/schemas/CheerUser'
    ResponseGetCommentlist:
      allOf:
        - $ref: '#/components/schemas/ResponseBase'
        - type: object
          required:
            - total
            - comment
          properties:
            total:
              type: integer
              description: コメント数。
            comment:
              type: array
              description: コメントの一覧。
              items:
                $ref: '#/components/schemas/Comment'
    ResponseGetGenrelist:
      allOf:
        - $ref: '#/components/schemas/ResponseBase'
        - type: object
          required:
            - genrelist
          properties:
            genrelist:
              type: array
              description: ジャンルの定義一覧。
              items:
                $ref: '#/components/schemas/Genre'
    ResponseGetPlan:
      allOf:
        - $ref: '#/components/schemas/ResponseBase'
        - type: object
          required:
            - plan
          properties:
            plan:
              $ref: '#/components/schemas/PlanDetail'
    ResponseGetPlanCommentlist:
      $ref: '#/components/schemas/ResponseGetCommentlist'
    ResponseGetPlanlist:
      allOf:
        - $ref: '#/components/schemas/ResponseBase'
        - type: object
          required:
            - total
            - planlist
          properties:
            total:
              type: integer
              description: 全件数。
            planlist:
              type: array
              description: 山行計画の一覧。
              items:
                $ref: '#/components/schemas/PlanSummary'
    ResponseGetRec:
      allOf:
        - $ref: '#/components/schemas/ResponseBase'
        - type: object
          required:
            - rec
          properties:
            rec:
              $ref: '#/components/schemas/RecDetail'
    ResponseGetReclist:
      allOf:
        - $ref: '#/components/schemas/ResponseBase'
        - type: object
          required:
            - reclist
          properties:
            reclist:
              type: array
              description: 山行記録の一覧。
              items:
                $ref: '#/components/schemas/RecSummary'
    ResponseGetTypelist:
      allOf:
        - $ref: '#/components/schemas/ResponseBase'
        - type: object
          required:
            - typelist
          properties:
            typelist:
              type: array
              description: データ種別の定義一覧。
              items:
                $ref: '#/components/schemas/PoiType'
    ResponseGetUserInfo:
      allOf:
        - $ref: '#/components/schemas/ResponseBase'
        - type: object
          required:
            - userinfo
          properties:
            userinfo:
              $ref: '#/components/schemas/UserInfo'
    ResponseOAuthError:
      type: object
      description: |-
        OAuth エンドポイント失敗時レスポンス。

        HTTP ステータスは `200` で返り、`error` フィールド (`1`) で失敗を示す。
        通常 API のエラー形式 (`ResponseError`、`err`/`errcode`) とはフィールド名が異なる点に注意。
      required:
        - access_token
        - error
        - error_message
      properties:
        access_token:
          type: string
          description: 失敗時は空文字。
        error:
          type: integer
          enum:
            - 1
          description: エラーの有無 (常に `1`)。
        error_message:
          type: string
          description: エラー要因の説明メッセージ。
    ResponsePostAddCheer:
      $ref: '#/components/schemas/ResponseBase'
    ResponsePostAddComment:
      allOf:
        - $ref: '#/components/schemas/ResponseBase'
