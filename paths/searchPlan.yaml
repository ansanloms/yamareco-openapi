post:
  operationId: postSearchPlan
  summary: 山行計画の検索
  tags:
    - plan
  description:
    $ref: ./descriptions/postSearchPlan.md
  security: []
  requestBody:
    required: true
    content:
      application/x-www-form-urlencoded:
        schema:
          $ref: ../components/schemas/RequestPostSearchPlan.yaml
  responses:
    "200":
      description: |-
        処理結果。HTTP 200 でレスポンスボディの `err` フィールドにより成否を判定する。
        - `err: 0`: 処理成功 (Success スキーマ)
        - `err: 1`: サーバ処理エラー (`ResponseError` スキーマ、`errcode` でエラー要因)。

      content:
        application/json:
          schema:
            oneOf:
              - $ref: ../components/schemas/ResponsePostSearchPlan.yaml
              - $ref: ../components/schemas/ResponseError.yaml
