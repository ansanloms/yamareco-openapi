post:
  operationId: postNearbyPoi
  summary: 近傍の地名 (POI) データ検索
  tags:
    - other
  description:
    $ref: ./descriptions/postNearbyPoi.md
  security: []
  requestBody:
    required: true
    content:
      application/x-www-form-urlencoded:
        schema:
          $ref: ../components/schemas/RequestPostNearbyPoi.yaml
  responses:
    "200":
      description: |-
        処理結果。HTTP 200 でレスポンスボディの `err` フィールドにより成否を判定する。
        - `err: 0`: 処理成功 (Success スキーマ)
        - `err: 1`: サーバ処理エラー (`ResponseError` スキーマ、`errcode` でエラー要因)。

      content:
        application/json:
          schema:
            oneOf:
              - $ref: ../components/schemas/ResponsePostNearbyPoi.yaml
              - $ref: ../components/schemas/ResponseError.yaml
