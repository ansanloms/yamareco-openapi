get:
  operationId: getReclistByPage
  summary: 山行記録一覧の取得 (全体)
  tags:
    - rec
  description:
    $ref: ./descriptions/getReclistByPage.md
  security: []
  parameters:
    - in: path
      name: page
      required: true
      description: 一覧のページ番号 (1 ページあたり 20 件)。
      schema:
        type: integer
        minimum: 1
        example: 1
    - in: query
      name: max_id
      required: false
      description: |-
        表示する最も最近の記録の ID。指定した記録を含み、それより古い記録一覧が返される。
      schema:
        type: integer
  responses:
    "200":
      description: |-
        処理結果。HTTP 200 でレスポンスボディの `err` フィールドにより成否を判定する。
        - `err: 0`: 処理成功 (Success スキーマ)
        - `err: 1`: サーバ処理エラー (`ResponseError` スキーマ、`errcode` でエラー要因)。

      content:
        application/json:
          schema:
            oneOf:
              - $ref: ../components/schemas/ResponseGetReclist.yaml
              - $ref: ../components/schemas/ResponseError.yaml
          examples:
            succeeded:
              value:
                $ref: ../examples/ResponseGetReclist.yaml
            failed:
              value:
                $ref: ../examples/ResponseError.yaml
