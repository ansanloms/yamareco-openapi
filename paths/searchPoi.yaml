post:
  operationId: postSearchPoi
  summary: 地名 (POI) データの検索
  tags:
    - other
  description:
    $ref: ./descriptions/postSearchPoi.md
  security: []
  requestBody:
    required: true
    content:
      application/x-www-form-urlencoded:
        schema:
          $ref: ../components/schemas/RequestPostSearchPoi.yaml
        examples:
          normal:
            value:
              $ref: ../examples/RequestPostSearchPoi.yaml
  responses:
    "200":
      description: |-
        処理結果。HTTP 200 でレスポンスボディの `err` フィールドにより成否を判定する。
        - `err: 0`: 処理成功 (Success スキーマ)
        - `err: 1`: サーバ処理エラー (`ResponseError` スキーマ、`errcode` でエラー要因)。

      content:
        application/json:
          schema:
            oneOf:
              - $ref: ../components/schemas/ResponsePostSearchPoi.yaml
              - $ref: ../components/schemas/ResponseError.yaml
          examples:
            succeeded:
              value:
                $ref: ../examples/ResponsePostSearchPoi.yaml
            failed:
              value:
                $ref: ../examples/ResponseError.yaml
