get:
  operationId: getGetArealist
  summary: エリア定義一覧の取得。
  tags:
    - other
  description:
    $ref: ./descriptions/getGetArealist.md
  security: []
  responses:
    "200":
      description: |-
        処理結果。HTTP 200 でレスポンスボディの `err` フィールドにより成否を判定する。
        - `err: 0`: 処理成功 (Success スキーマ)
        - `err: 1`: サーバ処理エラー (`ResponseError` スキーマ、`errcode` でエラー要因)。

      content:
        application/json:
          schema:
            $ref: ../components/schemas/ResponseGetArealistOrError.yaml
          examples:
            succeeded:
              value:
                $ref: ../examples/ResponseGetArealist/default.yaml
            failed:
              value:
                $ref: ../examples/ResponseError/default.yaml
