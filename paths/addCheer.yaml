post:
  operationId: postAddCheer
  summary: 拍手の登録。
  tags:
    - rec
  description:
    $ref: ./descriptions/postAddCheer.md
  requestBody:
    required: true
    content:
      application/x-www-form-urlencoded:
        schema:
          $ref: ../components/schemas/RequestPostAddCheer.yaml
  responses:
    "200":
      description: |-
        処理結果。HTTP 200 でレスポンスボディの `err` フィールドにより成否を判定する。
        - `err: 0`: 処理成功 (Success スキーマ)
        - `err: 1`: サーバ処理エラー (`ResponseError` スキーマ、`errcode` でエラー要因)。

      content:
        application/json:
          schema:
            oneOf:
              - $ref: ../components/schemas/ResponsePostAddCheer.yaml
              - $ref: ../components/schemas/ResponseError.yaml
          examples:
            succeeded:
              value:
                $ref: ../examples/ResponsePostAddCheer.yaml
            failed:
              value:
                $ref: ../examples/ResponseError.yaml
    "403":
      description: OAuth 認証エラー。
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ResponseError.yaml
          examples:
            authError:
              value:
                $ref: ../examples/ResponseError.yaml
